[platformio]
default_envs = recovery_s3
boards_dir = ../boards
src_dir = main

[env:recovery_s3]
; Keep recovery on the same pioarduino toolchain as the main firmware.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1-n32r16v-local
framework = espidf
monitor_speed = 115200
build_type = release
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_build.flash_size = 32MB
board_build.psram_type = opi
extra_scripts =
  post:scripts/check_recovery_size.py
build_flags =
  -DRECOVERY_APP_BUILD=1
