; PlatformIO Project Configuration File
; S3 N32R16V bridge build matrix: hybrid-first with Arduino fallback.

[platformio]
default_envs = s3_mros_hub_n32
data_dir = data
src_dir = main

[env]
; pioarduino 55.03.38-1 bundles Arduino 3.3.8 and ESP-IDF 5.5.4.
; Native idf.py work in this repo can still use the separate local C:\esp\v6.0 toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1-n32r16v-local
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = release
lib_ldf_mode = chain+
board_build.partitions = partitions-N32R16.csv
board_build.filesystem = littlefs
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_build.flash_size = 32MB
board_build.psram_type = opi
upload_speed = 3000000
custom_uploadfs = yes
custom_upload_retry_speeds = 3000000,2000000,1500000,921600,460800
custom_artifact_board_slug = esp32s3n32r16v
extra_scripts =
  pre:scripts/sanitize_windows_build_env.py
  pre:scripts/force_max_jobs.py
  pre:scripts/enable_build_cache.py
  pre:scripts/upload_auto_fallback.py
  pre:scripts/select_sdkconfig_defaults.py
  pre:scripts/patch_pioarduino_manifest.py
  pre:scripts/recovery_bundle.py
  post:scripts/uploadfs_on_demand.py
  post:scripts/export_firmware_artifact.py
  post:scripts/generate_size_report.py
custom_recovery_project_dir = recovery_app
custom_recovery_env = recovery_s3
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=4
  -DMROS_ENABLE_WOLFSSH_BACKEND=1
  -DESP_ENABLE_WOLFSSH=1
  -DPIN_ONBOARD_RGB_LED=38
  -DCONFIG_LITTLEFS_PAGE_SIZE=256
  -DCONFIG_LITTLEFS_OBJ_NAME_LEN=64
  -I.
  -Isrc

[env:s3_mros_hub_n32]
framework = espidf
custom_sdkconfig_source = sdkconfig.defaults.s3
board_build.app_partition_name = app0

[env:s3_mros_hub_n16]
extends = env:s3_mros_hub_n32
board_build.flash_size = 16MB
board_build.partitions = partitions-N16R8.csv

[env:s3_mros_hub_n8]
extends = env:s3_mros_hub_n32
board_build.flash_size = 8MB
board_build.partitions = partitions-N8R8.csv

[env:s3_mros_hub_ddr_n32]
extends = env:s3_mros_hub_n32
custom_sdkconfig_source = sdkconfig.defaults.s3.psram120

[env:s3_mros_hub_ddr_n16]
extends = env:s3_mros_hub_ddr_n32
board_build.flash_size = 16MB
board_build.partitions = partitions-N16R8.csv

[env:s3_mros_hub_ddr_n8]
extends = env:s3_mros_hub_ddr_n32
board_build.flash_size = 8MB
board_build.partitions = partitions-N8R8.csv

[env:s3_mros_hub_n32_dbg]
extends = env:s3_mros_hub_n32
build_type = debug
build_unflags =
  -DCORE_DEBUG_LEVEL=4
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -Og
  -g3

[env:s3_mros_hub_n16_dbg]
extends = env:s3_mros_hub_n16
build_type = debug
build_unflags =
  -DCORE_DEBUG_LEVEL=4
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -Og
  -g3

[env:s3_mros_hub_n8_dbg]
extends = env:s3_mros_hub_n8
build_type = debug
build_unflags =
  -DCORE_DEBUG_LEVEL=4
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -Og
  -g3

[env:s3_mros_hub_ddr_n32_dbg]
extends = env:s3_mros_hub_ddr_n32
build_type = debug
build_unflags =
  -DCORE_DEBUG_LEVEL=4
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -Og
  -g3

[env:s3_mros_hub_ddr_n16_dbg]
extends = env:s3_mros_hub_ddr_n16
build_type = debug
build_unflags =
  -DCORE_DEBUG_LEVEL=4
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -Og
  -g3

[env:s3_mros_hub_ddr_n8_dbg]
