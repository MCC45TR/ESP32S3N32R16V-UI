name: public-release-hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Policy behavior tests
        run: |
          python tools/ci/test_public_release_hygiene.py
          python tools/ci/test_secret_scan.py
      - name: Public release hygiene
        run: python tools/ci/check_public_release_hygiene.py --repo-root .
      - name: Secret scan
        run: python tools/ci/scan_secrets.py --repo-root .
